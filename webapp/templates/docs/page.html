{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block head %}
<style>
.doc { max-width: 880px; margin: 0 auto; font-size: 15px; line-height: 1.6; color: #1d2733; }
.doc h1 { font-size: 28px; line-height: 1.25; margin: 4px 0 6px; }
.doc h2 { font-size: 20px; margin: 34px 0 10px; border-bottom: 1px solid #dde2e7; padding-bottom: 5px; }
.doc h3 { font-size: 16px; margin: 22px 0 6px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 10px 0 14px; }
.doc th, .doc td { border: 1px solid #dde2e7; padding: 6px 9px; text-align: left; vertical-align: top; }
.doc th { background: #f3f5f7; }
.doc td.n, .doc th.n { text-align: right; white-space: nowrap; }
.doc code { background: #f3f5f7; padding: 1px 5px; border-radius: 3px; font-size: 12.5px; }
.doc pre { background: #f3f5f7; padding: 10px 12px; border-radius: 4px; overflow-x: auto; font-size: 12.5px; line-height: 1.45; }
.doc pre code { background: none; padding: 0; }
.doc figure { margin: 14px 0 18px; }
.doc figure img { max-width: 100%; border: 1px solid #e3e6ea; border-radius: 4px; }
.doc figcaption { color: #5b6672; font-size: 12.5px; margin-top: 4px; }
.doc .lead { color: #4a5568; font-size: 16px; }
.doc .callout { background: #eef4fa; border-left: 4px solid #1f6fb2; padding: 9px 14px; margin: 12px 0; }
.doctools { display: flex; gap: 10px; align-items: center; margin: 0 auto 10px; max-width: 880px; font-size: 13px; }
.doctools a { color: #1f6fb2; text-decoration: none; }
@media print {
  .topnav, .doctools { display: none !important; }
  main.wrap { padding: 0; max-width: none; }
  .doc { max-width: none; font-size: 11pt; }
  .doc h2 { break-after: avoid; } .doc table, .doc figure { break-inside: avoid; }
}
</style>
{% endblock %}
{% block body %}
<div class="doctools">
  <a href="{{ request.script_root }}/docs">← {{ T('Все документы','All documents') }}</a>
  <span style="flex:1"></span>
  {% if pdf %}<a href="{{ request.script_root }}/docs/{{ pdf[:-4]|replace('_', '-') }}.pdf">{{ T('Скачать PDF','Download PDF') }}</a>{% endif %}
</div>
<article class="doc">
{% include body %}
</article>
{% endblock %}
