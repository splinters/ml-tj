# Фрагмент для server{} того же сервера, где опубликован стенд (/testmap/).
# Статические HTML-страницы блокнотов под паролем. Вставьте ПЕРЕД блоком
# location /testmap/ { proxy_pass ... } или подключите через include.
# Более длинный префикс выбирается nginx автоматически.
location /testmap/notebooks/ {
    alias /opt/ml_tj/notebooks_html/;
    index index.html;
    autoindex off;
    auth_basic "ML TJ notebooks";
    auth_basic_user_file /etc/nginx/ml_tj_notebooks.htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
}
